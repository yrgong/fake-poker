<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fake Poker - Texas Hold'em</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <div class="logo">
        <span class="suit-icon">♠</span>
        <h1>FAKE POKER</h1>
        <span class="suit-icon red">♥</span>
      </div>
      <div class="header-actions">
        <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊 Sound</button>
        <button id="reset-game-btn" class="btn secondary-btn" title="Reset All Chips">Reset Chips</button>
      </div>
    </header>

    <!-- Poker Table Area -->
    <main class="table-wrapper">
      <div class="poker-table">
        <div class="table-felt">
          <!-- Center Community Cards & Pot -->
          <div class="table-center">
            <div class="pot-display">
              <span class="pot-label">TOTAL POT</span>
              <span class="pot-amount" id="pot-amount">$0</span>
            </div>
            
            <div class="community-cards" id="community-cards">
              <div class="card-slot"></div>
              <div class="card-slot"></div>
              <div class="card-slot"></div>
              <div class="card-slot"></div>
              <div class="card-slot"></div>
            </div>

            <div class="game-phase-badge" id="game-phase">PRE-FLOP</div>
          </div>

          <!-- Players around table -->
          <!-- Bot 2 (Top) -->
          <div class="seat seat-top" id="seat-2">
            <div class="player-card">
              <div class="dealer-chip" id="dealer-2">D</div>
              <div class="player-avatar">🤖</div>
              <div class="player-info">
                <span class="player-name">Alice</span>
                <span class="player-chips" id="chips-2">$1,000</span>
              </div>
              <div class="player-bet-bubble" id="bet-2">$0</div>
            </div>
            <div class="player-cards" id="cards-2"></div>
            <div class="player-status" id="status-2">Ready</div>
          </div>

          <!-- Bot 1 (Left) -->
          <div class="seat seat-left" id="seat-1">
            <div class="player-card">
              <div class="dealer-chip" id="dealer-1">D</div>
              <div class="player-avatar">🤠</div>
              <div class="player-info">
                <span class="player-name">Bob</span>
                <span class="player-chips" id="chips-1">$1,000</span>
              </div>
              <div class="player-bet-bubble" id="bet-1">$0</div>
            </div>
            <div class="player-cards" id="cards-1"></div>
            <div class="player-status" id="status-1">Ready</div>
          </div>

          <!-- Bot 3 (Right) -->
          <div class="seat seat-right" id="seat-3">
            <div class="player-card">
              <div class="dealer-chip" id="dealer-3">D</div>
              <div class="player-avatar">🕶️</div>
              <div class="player-info">
                <span class="player-name">Charlie</span>
                <span class="player-chips" id="chips-3">$1,000</span>
              </div>
              <div class="player-bet-bubble" id="bet-3">$0</div>
            </div>
            <div class="player-cards" id="cards-3"></div>
            <div class="player-status" id="status-3">Ready</div>
          </div>

          <!-- Human Player (Bottom) -->
          <div class="seat seat-bottom active-turn" id="seat-0">
            <div class="player-card human-card">
              <div class="dealer-chip" id="dealer-0">D</div>
              <div class="player-avatar">👤</div>
              <div class="player-info">
                <span class="player-name">You</span>
                <span class="player-chips" id="chips-0">$1,000</span>
              </div>
              <div class="player-bet-bubble" id="bet-0">$0</div>
            </div>
            <div class="player-cards" id="cards-0"></div>
            <div class="hand-evaluation" id="hand-rank-desc">High Card</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Controls & Action Bar -->
    <footer class="controls-container">
      <div class="log-panel" id="log-panel">
        <div class="log-messages" id="log-messages">
          <div class="log-entry system">Welcome to Fake Poker! Click "Start Hand" to begin.</div>
        </div>
      </div>

      <div class="action-panel">
        <div class="start-controls" id="start-controls">
          <button id="start-btn" class="btn primary-btn large-btn">Start Hand</button>
        </div>

        <div class="betting-controls" id="betting-controls" style="display: none;">
          <div class="bet-slider-row">
            <input type="range" id="raise-slider" min="20" max="1000" step="10" value="40" />
            <span class="raise-val" id="raise-val">$40</span>
            <div class="quick-bets">
              <button class="quick-bet-btn" data-type="min">Min</button>
              <button class="quick-bet-btn" data-type="half">1/2 Pot</button>
              <button class="quick-bet-btn" data-type="pot">Pot</button>
              <button class="quick-bet-btn" data-type="allin">All-In</button>
            </div>
          </div>

          <div class="action-buttons-row">
            <button id="fold-btn" class="btn danger-btn">Fold</button>
            <button id="check-call-btn" class="btn check-btn">Check</button>
            <button id="raise-btn" class="btn success-btn">Raise to $40</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
